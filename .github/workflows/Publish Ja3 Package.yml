name: Publish Ja3 Package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台列表，逗号分隔不要空格，如 linux/amd64,linux/arm64；留空=该变体默认平台'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快数倍）；该 runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      force:
        description: '强制重新构建（只影响「是否重建」，不影响发布资格；发布资格由 ref 与平台集合决定）'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
      - '**.png'
      - '**.json'
    branches: [master]
    tags: ["*"]

jobs:
  # 与 Publish Package 同理：ja3（带 OCR）只有 4 个平台可用——pycurl 的 ja3 线本身只发
  # 6 个平台，去掉 386 / arm/v6 后与 ddddocr / onnxruntime 的交集就是 4 个。
  # ja3-lite（无 OCR）能覆盖 6 个，于是用它补上 386 与 arm/v6。
  #
  # 三个 job 的职责：构建 / 组装清单 / 写 tag，其中只有 publish 碰 registry 的 tag。
  ja3:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: ja3
      dockerfile: Dockerfile.ja3
      default_platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
      check_impersonate: true
      tag_prefix: 'ja3-'
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  ja3-lite:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: ja3-lite
      dockerfile: Dockerfile.ja3-lite
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/riscv64
      check_impersonate: true
      tag_prefix: 'ja3-lite-'
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  merge:
    needs: [ja3, ja3-lite]
    name: Assemble digest lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.inputs.platforms == '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
    env:
      JA3_GROUPS: x86 arm riscv64
      JA3_LITE_ONLY_GROUPS: x86-32 armv6
      ALL_JA3_LITE_GROUPS: x86 x86-32 arm armv6 riscv64
    steps:
      - name: Download ja3 digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-ja3-*
          path: /tmp/d/ja3
      - name: Download ja3-lite digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-ja3-lite-*
          path: /tmp/d/ja3-lite
      - name: Assemble
        run: |
          set -euo pipefail
          dg() {
            local f="/tmp/d/$1/digests-$1-$2/$2.digest"
            [ -f "$f" ] || { echo "::error::缺少 digest: $f"; exit 1; }
            tr -d '[:space:]' < "$f"
          }
          srcs() {
            local variant=$1; shift
            for g in "$@"; do printf ' ghcr.io/qd-today/qd@%s' "$(dg "$variant" "$g")"; done
          }
          { srcs ja3 $JA3_GROUPS; srcs ja3-lite $JA3_LITE_ONLY_GROUPS; } > /tmp/srcs-ja3.txt
          { srcs ja3-lite $ALL_JA3_LITE_GROUPS; } > /tmp/srcs-ja3-lite.txt
          echo "ja3 来源: $(cat /tmp/srcs-ja3.txt)"
          echo "ja3-lite 来源: $(cat /tmp/srcs-ja3-lite.txt)"
          for f in /tmp/srcs-ja3.txt /tmp/srcs-ja3-lite.txt; do
            n=$(tr ' ' '\n' < "$f" | grep -c '^ghcr' || true)
            [ "$n" = "6" ] || { echo "::error::$f 期望 6 个 digest，实际 $n"; exit 1; }
          done
      - name: Upload digest lists
        uses: actions/upload-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp/srcs-ja3*.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [merge]
    name: Write tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.inputs.platforms == '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digest lists
        uses: actions/download-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to qdtoday DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.QD_DOCKER_USERNAME }}
          password: ${{ secrets.QD_DOCKER_PASSWORD }}
      - name: Login to a76yyyy DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Write tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          SRCS_JA3="$(cat /tmp/srcs-ja3.txt)"
          SRCS_JA3_LITE="$(cat /tmp/srcs-ja3-lite.txt)"

          if [ "$IS_TAG" = "true" ]; then
            JA3_TAGS="ja3-latest ja3-${REF_NAME}"
            JA3_LITE_TAGS="ja3-lite-latest ja3-lite-${REF_NAME}"
          else
            JA3_TAGS="ja3-dev"
            JA3_LITE_TAGS="ja3-lite-dev"
          fi

          publish() {
            local img=$1 tags=$2 srcs=$3
            for t in $tags; do
              echo "::group::${img}:${t}"
              docker buildx imagetools create -t "${img}:${t}" $srcs
              echo "::endgroup::"
            done
          }

          for reg in ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao; do
            publish "$reg" "$JA3_TAGS" "$SRCS_JA3"
            publish "$reg" "$JA3_LITE_TAGS" "$SRCS_JA3_LITE"
          done
      - name: Verify manifest platform completeness
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          is_tag = os.environ["IS_TAG"] == "true"
          ja3_tag = "ja3-latest" if is_tag else "ja3-dev"
          ja3_lite_tag = "ja3-lite-latest" if is_tag else "ja3-lite-dev"

          EXPECT = {"linux/amd64", "linux/arm64", "linux/arm/v7", "linux/riscv64",
                    "linux/386", "linux/arm/v6"}

          def platforms(tag):
              out = subprocess.run(["docker", "buildx", "imagetools", "inspect", tag, "--raw"],
                                   capture_output=True, text=True, check=True).stdout
              got = set()
              for m in json.loads(out).get("manifests", []):
                  p = m.get("platform") or {}
                  if not p:
                      continue
                  arch, variant = p.get("architecture"), p.get("variant")
                  got.add("linux/" + arch + (("/" + variant) if variant else ""))
              return got

          failed = False
          for reg in ("ghcr.io/qd-today/qd", "docker.io/qdtoday/qd", "docker.io/a76yyyy/qiandao"):
              for tag in (ja3_tag, ja3_lite_tag):
                  ref = f"{reg}:{tag}"
                  try:
                      got = platforms(ref)
                  except subprocess.CalledProcessError:
                      print(f"::error::{ref} 不存在")
                      failed = True
                      continue
                  if got != EXPECT:
                      print(f"::error::{ref} 平台集合不一致：缺 {EXPECT - got or '无'}，多 {got - EXPECT or '无'}")
                      failed = True
                  else:
                      print(f"{ref} 平台集合一致（6 个）")
          sys.exit(1 if failed else 0)
          PY
