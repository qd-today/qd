name: Publish Ja3 Package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台列表，逗号分隔不要空格，如 linux/amd64,linux/arm64；留空=该变体默认平台'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快数倍）；该 runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      force:
        description: '强制重新构建（只影响「是否重建」，不影响发布资格；发布资格由 ref 与平台集合决定）'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
      - '**.png'
      - '**.json'
    branches: [master]
    tags: ["*"]

jobs:
  # 与 Publish Package 同理：ja3（带 OCR）只有 4 个平台可用——pycurl 的 ja3 线本身只发
  # 6 个平台，去掉 386 / arm/v6 后与 ddddocr / onnxruntime 的交集就是 4 个。
  # ja3-lite（无 OCR）能覆盖 6 个，于是用它补上 386 与 arm/v6。
  #
  # 三个 job 的职责：构建 / 组装清单 / 写 tag，其中只有 publish 碰 registry 的 tag。
  ja3:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: ja3
      dockerfile: Dockerfile.ja3
      default_platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
      check_impersonate: true
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  ja3-lite:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: ja3-lite
      dockerfile: Dockerfile.ja3-lite
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/riscv64
      check_impersonate: true
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  merge:
    needs: [ja3, ja3-lite]
    name: Assemble digest lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == '') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download ja3 digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-ja3-*
          path: /tmp/d/ja3
      - name: Download ja3-lite digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-ja3-lite-*
          path: /tmp/d/ja3-lite
      - name: Assemble
        env:
          # 组名由 _image.yml 的 plan 输出提供（GROUPS 只有一处定义）
          MAIN_GROUPS_CSV: ${{ needs.ja3.outputs.groups }}
          LITE_GROUPS_CSV: ${{ needs.ja3-lite.outputs.groups }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/assemble_manifests.py \
            --main-variant ja3 --lite-variant ja3-lite \
            --main-groups "$MAIN_GROUPS_CSV" --lite-groups "$LITE_GROUPS_CSV" \
            --digest-root /tmp/d --image ghcr.io/qd-today/qd \
            --out /tmp/srcs
      - name: Upload digest lists
        uses: actions/upload-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp/srcs-ja3*.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [merge]
    name: Write tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == '') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download digest lists
        uses: actions/download-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to qdtoday DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.QD_DOCKER_USERNAME }}
          password: ${{ secrets.QD_DOCKER_PASSWORD }}
      - name: Login to a76yyyy DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Write tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          SRCS_A="$(cat /tmp/srcs-ja3.txt)"
          SRCS_B="$(cat /tmp/srcs-ja3-lite.txt)"
          # 标签归属由 publish_tags.py 决定：master 只推进 dev，tag 只写 latest 与版本号
          eval "$(python3 .github/workflows/scripts/publish_tags.py \
            --is-tag "$([ "$IS_TAG" = "true" ] && echo true || echo false)" \
            --version "$REF_NAME" \
            --a-prefix "ja3-" --a-tag latest \
            --b-prefix "ja3-lite-" --b-tag latest \
            --registries "ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao")"

          for reg in $REGISTRIES; do
            for t in $A_TAGS; do
              echo "::group::$reg:$t"
              docker buildx imagetools create -t "$reg:$t" $SRCS_A
              echo "::endgroup::"
            done
            for t in $B_TAGS; do
              echo "::group::$reg:$t"
              docker buildx imagetools create -t "$reg:$t" $SRCS_B
              echo "::endgroup::"
            done
          done
      - name: Verify manifest platform completeness
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          EXPECT_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64,linux/386,linux/arm/v6
        run: |
          set -euo pipefail
          eval "$(python3 .github/workflows/scripts/publish_tags.py \
            --is-tag "$([ "$IS_TAG" = "true" ] && echo true || echo false)" \
            --version "$REF_NAME" \
            --a-prefix "ja3-" --a-tag latest \
            --b-prefix "ja3-lite-" --b-tag latest \
            --registries "ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao")"
          # 三个 registry 的 tag 名集合必须一致，逐个校验平台集合
          REFS=""
          for reg in $REGISTRIES; do
            for t in $A_TAGS $B_TAGS; do REFS="$REFS $reg:$t"; done
          done
          python3 .github/workflows/scripts/verify_manifests.py \
            --expect "$EXPECT_PLATFORMS" \
            $REFS
      - name: Clean up untagged manifests in GHCR
        # 构建期按 digest 推到 ghcr、不打 tag；发布成功后这些 digest 被 index 引用，
        # 只有失败或半途而废的才会悬空。delete-only-untagged-versions 恰好只清这类。
        # Docker Hub / MIRROR 不需要清理：它们只由 publish 写正式 tag，从不产生悬空 manifest。
        #
        # min-versions-to-keep 留 40：Package 与 Ja3 两个 workflow 共用 ghcr 包 qd，
        # 若一条线正在构建、另一条线同时在清理，设 0 会把对方刚推的 digest 删掉。
        # 单条线一次最多产生 8 个组 × 2 变体 = 16 个悬空 digest，留 40 足够隔离。
        if: always()
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: qd
          package-type: container
          min-versions-to-keep: 40
          delete-only-untagged-versions: 'true'
