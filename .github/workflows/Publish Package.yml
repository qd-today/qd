name: Publish Latest Package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台列表，逗号分隔不要空格，如 linux/amd64,linux/arm64；留空=该变体默认平台'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快数倍）；该 runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      force:
        description: '强制重新构建（只影响「是否重建」，不影响发布资格；发布资格由 ref 与平台集合决定）'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
      - '**.png'
      - '**.json'
    branches: [master]
    tags: ["*"]

jobs:
  # latest 只有 6 个平台（386 / arm/v6 / s390x 没有 OCR 的 wheelhouse，连 --mount 都解析不了），
  # 而 lite 只依赖 pycurl、能覆盖 9 个。所以 lite 构建一次，既产出 lite-latest，
  # 又用它的 digest 补上 latest 缺的那 3 个平台。
  #
  # 三个 job 的职责严格分开：
  #   latest / lite  只构建 + 冒烟（digest 是否推 GHCR 由 _image.yml 的 ref 门禁决定）
  #   merge          只组装 digest 清单并传递，不碰任何 registry
  #   publish        唯一写 tag 的地方
  latest:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: latest
      dockerfile: Dockerfile
      default_platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64
      check_impersonate: false
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  lite:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: lite
      dockerfile: Dockerfile.lite
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
      check_impersonate: false
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  merge:
    needs: [latest, lite]
    name: Assemble digest lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 只在「发布 ref + 两个构建都成功 + 没指定平台子集」时组装：
    # 子集构建缺 digest，拼出来的 manifest 会残缺，宁可不出
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.inputs.platforms == '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
    steps:
      - name: Download latest digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-latest-*
          path: /tmp/d/latest
      - name: Download lite digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-lite-*
          path: /tmp/d/lite
      - name: Assemble
        env:
          # 组名由 _image.yml 的 plan 输出（GROUPS 是唯一来源），这里不再维护第二份列表
          latest_GROUPS_CSV: ${{ needs.latest.outputs.groups }}
          lite_GROUPS_CSV: ${{ needs.lite.outputs.groups }}
        run: |
          set -euo pipefail
          dg() {
            local f="/tmp/d/$1/digests-$1-$2/$2.digest"
            [ -f "$f" ] || { echo "::error::缺少 digest: $f"; exit 1; }
            tr -d '[:space:]' < "$f"
          }
          srcs() {
            local variant=$1; shift
            for g in "$@"; do printf ' ghcr.io/qd-today/qd@%s' "$(dg "$variant" "$g")"; done
          }
          MAIN_GROUPS="$(echo "${MAIN_GROUPS_CSV}" | tr ',' ' ')"
          ALL_LITE_GROUPS="$(echo "${LITE_GROUPS_CSV}" | tr ',' ' ')"
          # 主线覆盖不到的组 = lite 有、main 没有；用它补位
          LITE_ONLY_GROUPS=$(comm -13 <(printf '%s\n' $MAIN_GROUPS | sort) \
                                      <(printf '%s\n' $ALL_LITE_GROUPS | sort) | paste -sd' ' -)
          echo "main 组: $MAIN_GROUPS"
          echo "lite 补位: $LITE_ONLY_GROUPS"
          # latest：main 的平台 + lite 补位的三个
          { srcs latest $MAIN_GROUPS; srcs lite $LITE_ONLY_GROUPS; } > /tmp/srcs-latest.txt
          { srcs lite $ALL_LITE_GROUPS; } > /tmp/srcs-lite.txt
          echo "latest 来源: $(cat /tmp/srcs-latest.txt)"
          echo "lite 来源: $(cat /tmp/srcs-lite.txt)"
          # latest 应当 9 个平台引用、lite 也是 9 个
          for f in /tmp/srcs-latest.txt /tmp/srcs-lite.txt; do
            n=$(tr ' ' '\n' < "$f" | grep -c '^ghcr' || true)
            [ "$n" = "9" ] || { echo "::error::$f 期望 9 个 digest，实际 $n"; exit 1; }
          done
      - name: Upload digest lists
        uses: actions/upload-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp/srcs-*.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [merge]
    name: Write tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 唯一写 tag 的地方；门禁与 _image.yml 的 digest 推送保持一致
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.inputs.platforms == '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digest lists
        uses: actions/download-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to qdtoday DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.QD_DOCKER_USERNAME }}
          password: ${{ secrets.QD_DOCKER_PASSWORD }}
      - name: Login to a76yyyy DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Write tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          SRCS_LATEST="$(cat /tmp/srcs-latest.txt)"
          SRCS_LITE="$(cat /tmp/srcs-lite.txt)"

          # 标签归属：master push 只推进 dev，tag push 只写 latest + 版本。
          # 两族互斥，任何一次运行只影响其中一族。
          if [ "$IS_TAG" = "true" ]; then
            LATEST_TAGS="latest ${REF_NAME}"
            LITE_TAGS="lite-latest lite-${REF_NAME}"
          else
            LATEST_TAGS="dev"
            LITE_TAGS="lite-dev"
          fi

          publish() {
            local img=$1 tags=$2 srcs=$3
            for t in $tags; do
              echo "::group::${img}:${t}"
              docker buildx imagetools create -t "${img}:${t}" $srcs
              echo "::endgroup::"
            done
          }

          # 三个 registry 的 tag 名集合必须完全一致
          for reg in ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao; do
            publish "$reg" "$LATEST_TAGS" "$SRCS_LATEST"
            publish "$reg" "$LITE_TAGS" "$SRCS_LITE"
          done
      - name: Verify manifest platform completeness
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          is_tag = os.environ["IS_TAG"] == "true"
          ver = os.environ["REF_NAME"]
          latest_tag = "latest" if is_tag else "dev"
          lite_tag = "lite-latest" if is_tag else "lite-dev"

          # 同一个 tag 在三个 registry 上指向同一份内容，但各 registry 的
          # manifest digest 互不相同，所以按 tag 名逐个校验平台集合即可
          EXPECT_PLATFORMS = [
              "linux/amd64", "linux/arm64", "linux/arm/v7",
              "linux/ppc64le", "linux/riscv64", "linux/loong64",
              "linux/386", "linux/arm/v6", "linux/s390x",
          ]

          def platforms(tag):
              out = subprocess.run(["docker", "buildx", "imagetools", "inspect", tag, "--raw"],
                                   capture_output=True, text=True, check=True).stdout
              got = set()
              for m in json.loads(out).get("manifests", []):
                  p = m.get("platform") or {}
                  if not p:
                      continue
                  arch, variant = p.get("architecture"), p.get("variant")
                  got.add("linux/" + arch + (("/" + variant) if variant else ""))
              return got

          failed = False
          for reg in ("ghcr.io/qd-today/qd", "docker.io/qdtoday/qd", "docker.io/a76yyyy/qiandao"):
              for tag in (latest_tag, lite_tag):
                  ref = f"{reg}:{tag}"
                  try:
                      got = platforms(ref)
                  except subprocess.CalledProcessError:
                      print(f"::error::{ref} 不存在")
                      failed = True
                      continue
                  if got != set(EXPECT_PLATFORMS):
                      print(f"::error::{ref} 平台集合不一致：缺 {set(EXPECT_PLATFORMS) - got or '无'}，多 {got - set(EXPECT_PLATFORMS) or '无'}")
                      failed = True
                  else:
                      print(f"{ref} 平台集合一致（9 个）")
          sys.exit(1 if failed else 0)
          PY
