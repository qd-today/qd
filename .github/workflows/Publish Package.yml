name: Publish Latest Package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台列表，逗号分隔不要空格，如 linux/amd64,linux/arm64；留空=该变体默认平台'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快数倍）；该 runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      force:
        description: '强制重新构建（只影响「是否重建」，不影响发布资格；发布资格由 ref 与平台集合决定）'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
      - '**.png'
      - '**.json'
    branches: [master]
    tags: ["*"]

jobs:
  # latest 只有 6 个平台（386 / arm/v6 / s390x 没有 OCR 的 wheelhouse，连 --mount 都解析不了），
  # 而 lite 只依赖 pycurl、能覆盖 9 个。所以 lite 构建一次，既产出 lite-latest，
  # 又用它的 digest 补上 latest 缺的那 3 个平台。
  #
  # 三个 job 的职责严格分开：
  #   latest / lite  只构建 + 冒烟（digest 是否推 GHCR 由 _image.yml 的 ref 门禁决定）
  #   merge          只组装 digest 清单并传递，不碰任何 registry
  #   publish        唯一写 tag 的地方
  latest:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: latest
      dockerfile: Dockerfile
      default_platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64
      check_impersonate: false
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  lite:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: lite
      dockerfile: Dockerfile.lite
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
      check_impersonate: false
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}

  merge:
    needs: [latest, lite]
    name: Assemble digest lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 只在「发布 ref + 两个构建都成功 + 没指定平台子集」时组装。
    # 子集构建缺 digest，拼出来的 manifest 会残缺，宁可不出。
    # 平台子集只可能出现在 dispatch：push 事件没有 inputs，取值是 null，
    # 直接比 == '' 会判 false 而把整条链路跳过。
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == '') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download latest digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-latest-*
          path: /tmp/d/latest
      - name: Download lite digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-lite-*
          path: /tmp/d/lite
      - name: Assemble
        env:
          # 组名由 _image.yml 的 plan 输出提供（GROUPS 只有一处定义）
          MAIN_GROUPS_CSV: ${{ needs.latest.outputs.groups }}
          LITE_GROUPS_CSV: ${{ needs.lite.outputs.groups }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/assemble_manifests.py \
            --main-variant latest --lite-variant lite \
            --main-groups "$MAIN_GROUPS_CSV" --lite-groups "$LITE_GROUPS_CSV" \
            --digest-root /tmp/d --image ghcr.io/qd-today/qd \
            --out /tmp/srcs
      - name: Upload digest lists
        uses: actions/upload-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp/srcs-*.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [merge]
    name: Write tags
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 唯一写 tag 的地方；门禁与 _image.yml 的 digest 推送保持一致
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || github.event.inputs.platforms == '') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download digest lists
        uses: actions/download-artifact@v4
        with:
          name: manifest-srcs
          path: /tmp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to qdtoday DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.QD_DOCKER_USERNAME }}
          password: ${{ secrets.QD_DOCKER_PASSWORD }}
      - name: Login to a76yyyy DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Write tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          SRCS_LATEST="$(cat /tmp/srcs-latest.txt)"
          SRCS_LITE="$(cat /tmp/srcs-lite.txt)"

          # 标签归属：master push 只推进 dev，tag push 只写 latest + 版本。
          # 两族互斥，任何一次运行只影响其中一族。
          if [ "$IS_TAG" = "true" ]; then
            LATEST_TAGS="latest ${REF_NAME}"
            LITE_TAGS="lite-latest lite-${REF_NAME}"
          else
            LATEST_TAGS="dev"
            LITE_TAGS="lite-dev"
          fi

          publish() {
            local img=$1 tags=$2 srcs=$3
            for t in $tags; do
              echo "::group::${img}:${t}"
              docker buildx imagetools create -t "${img}:${t}" $srcs
              echo "::endgroup::"
            done
          }

          # 三个 registry 的 tag 名集合必须完全一致
          for reg in ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao; do
            publish "$reg" "$LATEST_TAGS" "$SRCS_LATEST"
            publish "$reg" "$LITE_TAGS" "$SRCS_LITE"
          done
      - name: Verify manifest platform completeness
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          # 三个 registry 的 tag 名集合必须一致，逐个校验平台集合
          if [ "$IS_TAG" = "true" ]; then L="latest"; LT="lite-latest"; else L="dev"; LT="lite-dev"; fi
          REFS=""
          for reg in ghcr.io/qd-today/qd docker.io/qdtoday/qd docker.io/a76yyyy/qiandao; do
            REFS="$REFS $reg:$L $reg:$LT"
          done
          python3 .github/workflows/scripts/verify_manifests.py \
            --expect "linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64,linux/386,linux/arm/v6,linux/s390x" \
            $REFS
      - name: Clean up untagged manifests in GHCR
        # 构建期按 digest 推到 ghcr、不打 tag；发布成功后这些 digest 被 index 引用，
        # 只有失败或半途而废的才会悬空。delete-only-untagged-versions 恰好只清这类。
        # Docker Hub / MIRROR 不需要清理：它们只由 publish 写正式 tag，从不产生悬空 manifest。
        #
        # min-versions-to-keep 留 40：Package 与 Ja3 两个 workflow 共用 ghcr 包 qd，
        # 若一条线正在构建、另一条线同时在清理，设 0 会把对方刚推的 digest 删掉。
        # 单条线一次最多产生 8 个组 × 2 变体 = 16 个悬空 digest，留 40 足够隔离。
        if: always()
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: qd
          package-type: container
          min-versions-to-keep: 40
          delete-only-untagged-versions: 'true'
