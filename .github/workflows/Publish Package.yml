name: Publish Latest Package
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要构建的平台列表，逗号分隔不要空格，如 linux/amd64,linux/arm64；留空=该变体默认平台'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快数倍）；该 runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      force:
        description: '强制重新构建（默认会跳过「仅文档改动」或「该 commit 已验证过」的重复运行）'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '**.md'
      - '**.png'
      - '**.json'
    branches: [master]
    tags: ["*"]

jobs:
  # 四条线共用 .github/workflows/_image.yml（plan -> build -> smoke -> publish），
  # 差异全部通过 with 传入，避免多份 workflow 重复维护后逐渐漂移。
  #
  # 这里拆成两个构建 + 一个合并：
  #   latest 只有 6 个平台（没有 OCR wheelhouse 的 386 / arm/v6 / s390x 挂不上）
  #   lite 有 9 个平台（只依赖 pycurl），正好补上那 3 个空缺
  # 所以 latest 的 manifest 由两批 digest 拼成，lite 只构建一次同时服务 lite-latest。
  latest:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: latest
      dockerfile: Dockerfile
      default_platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64
      check_impersonate: false
      tag_prefix: ''
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}
      # 只构建与上传 digest，tag 合并在下面的 merge job 统一做（要拼两批来源）
      digest_only: true

  lite:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      variant: lite
      dockerfile: Dockerfile.lite
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
      check_impersonate: false
      tag_prefix: 'lite-'
      platforms: ${{ github.event.inputs.platforms || '' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      force: ${{ github.event.inputs.force == 'true' }}
      digest_only: true

  merge:
    needs: [latest, lite]
    name: Merge latest + lite digests and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 只在「两个构建都成功 + 没指定平台子集」时发布：
    # 子集构建缺 digest，拼出来的 manifest 会残缺，宁可跳过
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event.inputs.platforms == '' && github.event.inputs.force != 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
    env:
      # latest 由 main 提供这些组，其余三个用 lite 的
      MAIN_GROUPS: x86 arm ppc64le riscv64 loong64
      LITE_ONLY_GROUPS: x86-32 armv6 s390x
      ALL_LITE_GROUPS: x86 x86-32 arm armv6 ppc64le riscv64 s390x loong64
    steps:
      - name: Download latest digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-latest-*
          path: /tmp/d/latest
      - name: Download lite digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-lite-*
          path: /tmp/d/lite
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to qdtoday DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.QD_DOCKER_USERNAME }}
          password: ${{ secrets.QD_DOCKER_PASSWORD }}
      - name: Login to a76yyyy DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create manifests
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          dg() {  # dg <variant> <group>
            local f="/tmp/d/$1/digests-$1-$2/$2.digest"
            [ -f "$f" ] || { echo "::error::缺少 digest: $f"; exit 1; }
            tr -d '[:space:]' < "$f"
          }
          srcs() {  # 按 group 列表拼 ghcr 的 digest 引用
            local variant=$1; shift
            for g in "$@"; do printf ' ghcr.io/qd-today/qd@%s' "$(dg "$variant" "$g")"; done
          }

          SRCS_LATEST="$(srcs latest $MAIN_GROUPS)$(srcs lite $LITE_ONLY_GROUPS)"
          SRCS_LITE="$(srcs lite $ALL_LITE_GROUPS)"
          echo "latest 来源:${SRCS_LATEST}"
          echo "lite 来源:${SRCS_LITE}"

          # 与 _image.yml 的历史行为保持一致：
          #   master 推送 → <P>latest + <P>dev
          #   tag 推送    → <P>latest + <P>版本 + <P>dev（ghcr 仍只更新 <P>latest）
          LATEST_TAGS="dev"; LITE_TAGS="lite-dev"
          if [ "$IS_TAG" = "true" ]; then
            LATEST_TAGS="latest ${REF_NAME} dev"
            LITE_TAGS="lite-latest lite-${REF_NAME} lite-dev"
          fi
          GHCR_LATEST="latest"; GHCR_LITE="lite-latest"

          publish() {  # publish <registry-image> <tags> <srcs>
            local img=$1 tags=$2 srcs=$3
            for t in $tags; do
              echo "::group::${img}:${t}"
              docker buildx imagetools create -t "${img}:${t}" $srcs
              echo "::endgroup::"
            done
          }

          publish ghcr.io/qd-today/qd "$GHCR_LATEST" "$SRCS_LATEST"
          publish ghcr.io/qd-today/qd "$GHCR_LITE" "$SRCS_LITE"
          publish docker.io/qdtoday/qd "$LATEST_TAGS" "$SRCS_LATEST"
          publish docker.io/qdtoday/qd "$LITE_TAGS" "$SRCS_LITE"
          publish docker.io/a76yyyy/qiandao "$LATEST_TAGS" "$SRCS_LATEST"
          publish docker.io/a76yyyy/qiandao "$LITE_TAGS" "$SRCS_LITE"
      - name: Verify manifest platform completeness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys

          # latest 应当是 6 + 3 的并集；lite 是完整的 9 个
          EXPECT = {
              "ghcr.io/qd-today/qd:latest": {
                  "linux/amd64", "linux/arm64", "linux/arm/v7",
                  "linux/ppc64le", "linux/riscv64", "linux/loong64",
                  "linux/386", "linux/arm/v6", "linux/s390x",
              },
              "ghcr.io/qd-today/qd:lite-latest": {
                  "linux/amd64", "linux/arm64", "linux/arm/v7",
                  "linux/ppc64le", "linux/riscv64", "linux/loong64",
                  "linux/386", "linux/arm/v6", "linux/s390x",
              },
          }

          def platforms(tag):
              out = subprocess.run(["docker", "buildx", "imagetools", "inspect", tag, "--raw"],
                                   capture_output=True, text=True, check=True).stdout
              got = set()
              for m in json.loads(out).get("manifests", []):
                  p = m.get("platform") or {}
                  if not p:
                      continue
                  arch, variant = p.get("architecture"), p.get("variant")
                  got.add("linux/" + arch + (("/" + variant) if variant else ""))
              return got

          failed = False
          for tag, expect in EXPECT.items():
              got = platforms(tag)
              missing, extra = expect - got, got - expect
              if missing or extra:
                  print(f"::error::{tag} 平台集合不一致：缺 {missing or '无'}，多 {extra or '无'}")
                  failed = True
              else:
                  print(f"{tag} 平台集合一致：{', '.join(sorted(got))}")
          sys.exit(1 if failed else 0)
          PY
