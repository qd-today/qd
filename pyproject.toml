[project]
name = "qd"
version = "0.0.0"
description = "QD 定时签到框架的运行依赖"
requires-python = ">=3.14"

# 依赖口径：
#   - wheelhouse 提供的包用 `==` 钉死，其余用 `>=` 下限；精确版本由 uv.lock 冻结
#   - 为什么这几个必须钉：Docker 构建里 `uv lock` 只能从 PyPI 解析版本，而安装时优先命中
#     本地 wheelhouse。两边版本不一致时 uv 会去 PyPI 取「更高版本」，然后在 musl 上找不到
#     轮子直接失败（onnxruntime 与 opencv 的 PyPI 轮子都只有 manylinux）。钉死后 lock 与
#     wheelhouse tag 一一对应，改一层就要同步改这里
#   - opencv-python-headless 的版本是「<上游版本>.<构建号>」，PyPI 上只有 5.0.0.93 这种
#     四段式；wheelhouse 里那份也标 5.0.0.93（源码 tag 仍是 5.0.0）
dependencies = [
    # ---- 基座镜像 / Alpine 源提供的（Docker 构建时自动跳过）----
    "aiohappyeyeballs>=2.6.1",
    "aiohttp>=3.13.5,<4",
    "aiosignal>=1.4.0",
    "async-timeout>=4.0.3",
    "attrs>=26.1.0",
    "charset-normalizer>=3.4.9",
    "frozenlist>=1.8.0",
    "greenlet>=3.5.0",
    "idna>=3.16",
    "markupsafe>=3.0.3",
    "multidict>=6.7.1",
    "packaging>=26.2",
    "propcache>=0.5.2",
    "pycryptodome>=3.23.0",
    "pycurl==7.49.0",
    "six>=1.17.0",
    "tornado>=6.5.5,<7",
    "typing-extensions>=4.15.0",
    "urllib3>=2.7.0,<3",
    "wrapt>=2.1.2",
    "yarl>=1.24.2",

    # ---- 纯 Python，从 PyPI 安装 ----
    "aiofiles>=25.1.0",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "certifi>=2026.10.23",
    "colorama>=0.4.6; sys_platform == 'win32'",
    "croniter>=6.2.4",
    "faker>=40.43.0",
    "incremental>=24.11.0",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pbkdf2>=1.3",
    # 锁在 1.x 最后一版：1.2.0 弃用了 Connection.ping() 的 reconnect 参数（默认
    # True → False），SQLAlchemy 1.4 的 aiomysql 方言会因此改调无参 ping()，
    # 而 AsyncAdapt_aiomysql_connection.ping(self, reconnect) 要求该参数，
    # DB_TYPE=mysql 启动即 TypeError（issue #640）。1.1.3 含 CVE-2024-36039
    # 与 callproc 的 procname 转义两处安全修复，是 1.x 的安全终点。
    "pymysql>=1.1.3,<1.2",
    "pysocks>=1.7.1",
    "python-dateutil>=3.0.0",
    "pytz>=2026.5",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "setuptools>=84.2.1",
    # 1.4 的最后一个版本：2.x 是破坏性迁移，db/ 层还是 1.4 写法，需单独一轮改造
    "sqlalchemy[asyncio]==1.4.54",
    "tzdata>=2026.5",
    "u-msgpack-python>=2.8.0",
]

[project.optional-dependencies]
# OCR 栈：三个 wheel 来自 ddddocr 与 onnxruntime 的 wheelhouse，版本必须与那两个 tag 对齐。
# 声明成 extra 是因为 lite 线故意不带它——runtime 用 QIANDAO_LITE 关闭相关功能。
# 非 Docker 用户想用 OCR 就 pip install .[ocr]（会从 PyPI 装同名发行名）。
#
# 386 与 s390x 用 marker 排除：onnxruntime 只在 PyPI 发 x86_64 / aarch64 的轮子，
# 这两个架构没有可用的 musllinux 轮子。marker 求值后它们从 --extra ocr 里消失，
# 等价于「装了 extra 但什么也不装」，不需要在 Dockerfile 里再判断一次。
# armv6 没法用 marker 表达：platform.machine() 在 armv6 容器里报的是内核值 armv7l
# （与 armv7 无法区分），由 Dockerfile 的 TARGETVARIANT 处理。

ocr = [
    "ddddocr==1.6.1; platform_machine != 'i686' and platform_machine != 's390x'",
    "numpy==2.4.6; platform_machine != 'i686' and platform_machine != 's390x'",
    "onnxruntime==1.24.4; platform_machine != 'i686' and platform_machine != 's390x'",
    "opencv-python-headless==5.0.0.93; platform_machine != 'i686' and platform_machine != 's390x'",
    "pillow==13.0.0; platform_machine != 'i686' and platform_machine != 's390x'",
]

[tool.uv]
# 本项目不发布、也没有 build-system：Docker 里只 export 依赖清单，不装 qd 自身
package = false
